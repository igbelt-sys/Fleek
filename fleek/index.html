<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FLEEK</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="topbar">
        <div class="logo">
            <img src="logopng.png" alt="Fleek Logo">
            <h1>FLEEK</h1>
        </div>

        <nav class="menu">
            <button class="icon-btn" id="btn-playlist" aria-label="Playlist">
                <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                    stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="4" width="14" height="4" rx="1"></rect>
                    <rect x="3" y="10" width="10" height="4" rx="1"></rect>
                    <rect x="3" y="16" width="6" height="4" rx="1"></rect>
                    <circle cx="20" cy="14" r="2"></circle>
                    <path d="M20 12v4"></path>
                </svg>
            </button>

            <button class="icon-btn" id="btn-search" aria-label="Pesquisar">
                <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="6"></circle>
                    <path d="M21 21l-4.35-4.35"></path>
                </svg>
            </button>

            <button class="icon-btn" id="btn-profile" aria-label="Perfil">
                <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-3-3.87"></path>
                    <path d="M4 21v-2a4 4 0 0 1 3-3.87"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
            </button>

            <button class="icon-btn" id="btn-theme" aria-label="Modo Escuro/Claro">
                <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </button>
        </nav>

        <div class="buttons">
            <button class="glass-btn">Cadastre-se</button>
            <button class="glass-btn">Conecte-se</button>
        </div>
    </header>

    <main class="content">

        <section class="recomendacoes">
            <h2>Recomendações - NomeIA</h2>

            <div class="scroll">
                <div class="card">
                    <div class="img"></div>
                    <p>Música de acordo com últimas escutadas</p>
                </div>
                <div class="card">
                    <div class="img"></div>
                    <p>Álbum recomendado</p>
                </div>
                <div class="card">
                    <div class="img"></div>
                    <p>Artista recomendado</p>
                </div>
            </div>
        </section>

        <section class="artistas">
            <h2>Artistas em alta</h2>

            <div class="scroll">
                <div class="circle"></div>
                <div class="circle"></div>
                <div class="circle"></div>
                <div class="circle"></div>
            </div>
        </section>

    </main>

    <script src="script.js"></script>
</body>

</html>
