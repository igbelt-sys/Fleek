<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FLEEK - Buscar</title>

    <style>
        /* ==========================================================
           1. ESTILOS GERAIS (Copiado do index.html para consistência)
           ========================================================== */
        :root {
            --bg-color: linear-gradient(135deg, #1f1f1f, #121212);
            --text-color: #f0f0f0;
            --text-muted: #a0a0a0;
            --card-bg: rgba(30, 30, 30, 0.5);
            --card-border: rgba(255, 255, 255, 0.08);
            --blur-amount: 15px;
            --accent-color: #9f55ff;
            /* Padrão (Roxo Fleek) */
        }

        :root.light-mode {
            --bg-color: linear-gradient(135deg, #f0f2f5, #e0e5ec);
            --text-color: #1a1a1a;
            --text-muted: #555;
            --card-bg: rgba(255, 255, 255, 0.6);
            --card-border: rgba(0, 0, 0, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            transition: background 0.3s ease, color 0.3s ease;
            min-height: 100vh;
            padding-top: 100px;
        }

        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
            font-weight: 700;
        }

        /* Links (para links de navegação futuros) */
        a {
            color: var(--text-color);
            text-decoration: none;
        }

        /* --- 2. HEADER (Topbar) --- */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 5vw;
            height: 80px;
            background: var(--card-bg);
            backdrop-filter: blur(var(--blur-amount));
            -webkit-backdrop-filter: blur(var(--blur-amount));
            border-bottom: 1px solid var(--card-border);
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo img {
            height: 40px;
            width: 40px;
            border-radius: 8px;
        }

        .logo h1 {
            font-size: 2.25rem;
            color: var(--accent-color);
            transition: color 0.3s ease;
        }

        .menu {
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 10px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s ease;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .light-mode .icon-btn:hover {
            background: rgba(0, 0, 0, 0.1);
        }

        .icon-svg {
            width: 24px;
            height: 24px;
            stroke: var(--text-color);
            transition: stroke 0.3s ease;
        }

        /* Cor de destaque para o ícone de busca (página ativa) */
        #btn-search .icon-svg {
            stroke: var(--accent-color);
        }

        /* --- 3. CONTEÚDO PRINCIPAL (Busca) --- */
        .content {
            padding: 20px 5vw;
            display: flex;
            flex-direction: column;
            gap: 40px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Barra de Busca Principal */
        .search-bar-container {
            position: relative;
            width: 100%;
            margin-bottom: 20px;
        }

        .main-search-input {
            width: 100%;
            padding: 18px 25px 18px 60px;
            /* Espaço para o ícone */
            border-radius: 12px;
            border: 1px solid var(--card-border);
            background-color: var(--card-bg);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);

            font-size: 1.1rem;
            color: var(--text-color);
            outline: none;
            transition: all 0.3s ease;
        }

        .main-search-input:focus {
            border-color: var(--accent-color);
            background-color: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 15px var(--accent-color);
        }

        .main-search-input::placeholder {
            color: var(--text-muted);
        }

        .search-icon-svg {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 24px;
            height: 24px;
            stroke: var(--text-muted);
            pointer-events: none;
        }

        /* --- 4. SEÇÕES (Resultados e Gêneros) --- */
        .content section h2 {
            font-size: 1.75rem;
            margin-bottom: 20px;
            color: var(--accent-color);
            transition: color 0.3s ease;
        }

        /* Grid para resultados e gêneros */
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .scroll {
            display: flex;
            gap: 20px;
            overflow-x: auto;
            padding-bottom: 20px;
            scrollbar-width: none;
        }

        .scroll::-webkit-scrollbar {
            display: none;
        }

        /* Cards de Gênero (Novo Estilo) */
        .genre-card {
            background-size: cover;
            background-position: center;
            border-radius: 12px;
            aspect-ratio: 1/1;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .genre-card:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .genre-card h3 {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 15px;
            font-size: 1.5rem;
            color: #fff;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.8);

            /* Fundo glass dentro do card */
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* --- 5. CARDS DE RESULTADOS (Reutilizados do index.html) --- */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(var(--blur-amount));
            -webkit-backdrop-filter: blur(var(--blur-amount));
            border-radius: 16px;
            width: 100%;
            /* Ajusta ao grid */
            padding: 15px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .card .img {
            width: 100%;
            height: 170px;
            /* Um pouco menor para caber mais */
            border-radius: 12px;
            margin-bottom: 15px;
            background-size: cover;
            background-position: center;
        }

        .card h4 {
            font-size: 1.1rem;
            color: var(--text-color);
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card p {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .artist-circle {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 100%;
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .artist-circle:hover {
            transform: scale(1.05);
        }

        .artist-circle .img {
            width: 170px;
            height: 170px;
            border-radius: 50%;
            background-size: cover;
            background-position: center;
            border: 2px solid var(--card-border);
        }

        .artist-circle p {
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-color);
            margin-top: 10px;
        }

        /* Loader */
        .loader {
            width: 48px;
            height: 48px;
            border: 5px solid var(--text-color);
            border-bottom-color: var(--accent-color);
            border-radius: 50%;
            display: block;
            margin: 40px auto;
            animation: rotation 1s linear infinite;
        }

        @keyframes rotation {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .hidden {
            display: none;
        }

        /* --- 6. POPOVER DE TEMA (Copiado do index.html) --- */
        .theme-popover {
            position: fixed;
            top: 90px;
            right: 5vw;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 16px;
            padding: 20px;
            width: 300px;
            z-index: 2000;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            transform: translateY(20px) scale(0.95);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
        }

        .theme-popover.active {
            transform: translateY(0) scale(1);
            opacity: 1;
            visibility: visible;
        }

        .popover-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .popover-header h3 {
            font-size: 1.2rem;
            color: var(--text-color);
        }

        #close-popover {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--text-muted);
            cursor: pointer;
            background: none;
            border: none;
        }

        #close-popover:hover {
            color: var(--text-color);
        }

        .theme-toggle {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.1);
            padding: 10px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .light-mode .theme-toggle {
            background: rgba(0, 0, 0, 0.05);
        }

        .theme-toggle span {
            font-weight: 500;
            color: var(--text-color);
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 28px;
        }

        .switch input {
            display: none;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #555;
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 20px;
            width: 20px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background-color: var(--accent-color);
        }

        input:checked+.slider:before {
            transform: translateX(22px);
        }

        .varset-title {
            font-weight: 500;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .color-palette {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }

        .color-swatch {
            width: 100%;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid var(--card-border);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .color-swatch:hover {
            transform: scale(1.1);
            border-color: var(--text-color);
        }
    </style>
</head>

    <!-- 
      ============================================================
      JAVASCRIPT (Lógica de Tema + Lógica da API do Spotify)
      ============================================================
    -->
    <script>
        // --- CÓDIGO DA API DO SPOTIFY ---

        // !! ATENÇÃO !!
        // 1. Cole seu Client ID aqui
        const clientId = 'acfec55c6b6448c5b8521549f9f1e8dc';
        // 2. Cole seu Client Secret aqui
        const clientSecret = '0ebed43e9c404666ad620e84a6813cb6';

        let spotifyToken = null; // Armazena o token
        let searchTimer; // Timer para "debounce" (evitar buscas a cada tecla)

        /**
         * Etapa 1: Pega o Token de Acesso
         */
        async function getSpotifyToken() {
            if (spotifyToken) return spotifyToken;

            const authString = btoa(`${clientId}:${clientSecret}`);
            try {
                const response = await fetch('https://accounts.spotify.com/api/token', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Basic ${authString}`,
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: 'grant_type=client_credentials'
                });
                if (!response.ok) throw new Error('Falha ao obter token');
                const data = await response.json();
                spotifyToken = data.access_token;
                return spotifyToken;
            } catch (error) {
                console.error('Erro ao obter o token do Spotify:', error);
                return null;
            }
        }

        /**
         * Etapa 2: Busca na API (Músicas, Álbuns e Artistas)
         */
        async function searchSpotify(query, token) {
            if (!query) return [];
            const encodedQuery = encodeURIComponent(query);
            // Busca por Músicas (track), Álbuns e Artistas
            const url = `https://api.spotify.com/v1/search?q=${encodedQuery}&type=track,album,artist&market=BR&limit=12`;

            try {
                const response = await fetch(url, {
                    method: 'GET',
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                if (!response.ok) throw new Error('Falha na busca');
                const data = await response.json();

                // Combina todos os resultados em uma lista
                const results = [
                    ...(data.tracks ? data.tracks.items : []),
                    ...(data.albums ? data.albums.items : []),
                    ...(data.artists ? data.artists.items : [])
                ];
                return results;

            } catch (error) {
                console.error('Erro ao buscar resultados:', error);
                return [];
            }
        }

        /**
         * Etapa 3: Renderiza os resultados no Grid
         */
        function renderResults(results) {
            const container = document.getElementById('search-results-grid');
            const resultsSection = document.getElementById('search-results-section');
            const genreSection = document.getElementById('genre-section');

            container.innerHTML = ''; // Limpa resultados antigos

            if (results.length === 0) {
                container.innerHTML = '<p class="text-muted">Nenhum resultado encontrado.</p>';
            }

            // Mostra a seção de resultados e esconde os gêneros
            resultsSection.classList.remove('hidden');
            genreSection.classList.add('hidden');

            results.forEach(item => {
                const card = document.createElement('div');
                const images = item.images || (item.album ? item.album.images : []);
                const imageUrl = images.length > 0 ? images[0].url : 'https://placehold.co/300x300/3a3a3a/eee?text=No+Image';

                if (item.type === 'artist') {
                    // Renderiza Artista
                    card.className = 'artist-circle';
                    card.innerHTML = `
                        <div class="img" style="background-image: url('${imageUrl}')"></div>
                        <p>${item.name}</p>
                    `;
                } else if (item.type === 'album') {
                    // Renderiza Álbum
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="img" style="background-image: url('${imageUrl}')"></div>
                        <h4>${item.name}</h4>
                        <p>Álbum por ${item.artists.map(a => a.name).join(', ')}</p>
                    `;
                } else if (item.type === 'track') {
                    // Renderiza Música (Track)
                    card.className = 'card';
                    card.innerHTML = `
                        <div class="img" style="background-image: url('${imageUrl}')"></div>
                        <h4>${item.name}</h4>
                        <p>Música por ${item.artists.map(a => a.name).join(', ')}</p>
                    `;
                }

                container.appendChild(card);
            });
        }

        // --- CÓDIGO DE TEMA (O mesmo de antes) ---
        document.addEventListener('DOMContentLoaded', () => {
            const themeBtn = document.getElementById('btn-theme');
            const themePopover = document.getElementById('theme-popover');
            const closePopoverBtn = document.getElementById('close-popover');
            const lightDarkToggle = document.getElementById('light-dark-toggle');
            const colorSwatches = document.querySelectorAll('.color-swatch');
            const root = document.documentElement;

            // Elementos da Página de Busca
            const searchInput = document.getElementById('main-search-input');
            const resultsSection = document.getElementById('search-results-section');
            const genreSection = document.getElementById('genre-section');
            const resultsGrid = document.getElementById('search-results-grid');

            // --- Lógica de Tema ---
            themeBtn.addEventListener('click', () => themePopover.classList.toggle('active'));
            closePopoverBtn.addEventListener('click', () => themePopover.classList.remove('active'));
            document.addEventListener('click', (e) => {
                if (!themeBtn.contains(e.target) && !themePopover.contains(e.target)) {
                    themePopover.classList.remove('active');
                }
            });

            lightDarkToggle.addEventListener('change', toggleTheme);
            function toggleTheme() {
                root.classList.toggle('light-mode');
                localStorage.setItem('fleek-theme', root.classList.contains('light-mode') ? 'light' : 'dark');
            }

            colorSwatches.forEach(swatch => {
                swatch.addEventListener('click', () => setAccentColor(swatch.dataset.color));
            });
            function setAccentColor(color) {
                root.style.setProperty('--accent-color', color);
                localStorage.setItem('fleek-accent', color);
            }

            function loadPreferences() {
                const savedTheme = localStorage.getItem('fleek-theme');
                if (savedTheme === 'light') {
                    root.classList.add('light-mode');
                    lightDarkToggle.checked = true;
                }
                const savedAccent = localStorage.getItem('fleek-accent');
                if (savedAccent) {
                    setAccentColor(savedAccent);
                }
            }

            // --- Lógica de Busca (Handler) ---
            searchInput.addEventListener('input', () => {
                // Limpa o timer anterior
                clearTimeout(searchTimer);

                const query = searchInput.value.trim();

                if (query === "") {
                    // Se a busca for limpa, volta aos gêneros
                    resultsSection.classList.add('hidden');
                    genreSection.classList.remove('hidden');
                    resultsGrid.innerHTML = '';
                    return;
                }

                // Define um timer para buscar 500ms *depois* que o usuário parar de digitar
                searchTimer = setTimeout(async () => {
                    resultsGrid.innerHTML = '<span class="loader"></span>'; // Mostra o loader

                    const token = await getSpotifyToken();
                    if (token) {
                        const results = await searchSpotify(query, token);
                        renderResults(results);
                    } else {
                        resultsGrid.innerHTML = '<p class="text-muted">Erro de autenticação. Verifique suas chaves.</p>';
                    }
                }, 500); // 500ms de "debounce"
            });


            // --- INICIALIZAÇÃO ---
            loadPreferences();
            getSpotifyToken(); // Pega o token assim que a página carrega
        });

    </script>
</body>

</html>
